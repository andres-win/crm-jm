 $("#cr").innerHTML=(ok?`<p class=mu>Radio 300 m · ${L.length} predio(s)</p>`:"")+`<table><tr><th>Predio</th><th>Distrito</th><th>Dirección</th><th>Torres</th><th>HPS</th><th>${ok?"Distancia":""}</th></tr>${L.map(x=>`<tr><td>${e(x.p.nombre)}</td><td>${e(x.p.distrito)}</td><td>${e(x.p.direccion)}</td><td>${e(x.p.torres)}</td><td>${x.p.hps??""}</td><td>${ok?Math.round(x.d)+" m":""}</td></tr>`).join("")||"<tr><td>Sin resultados. Carga predios primero.</td></tr>"}</table>`}
async function imp(){const rows=$("#ci").value.split("\n").map(l=>l.split(";")).filter(a=>a.length>=7&&!isNaN(+a[5])).map(a=>({nombre:a[0].toUpperCase(),distrito:a[1].toUpperCase(),direccion:a[2],torres:a[3],hps:+a[4]||null,lat:+a[5],lng:+a[6]}));if(!rows.length)return msg("No encontré filas válidas");const{error}=await sb.from("predios").insert(rows);msg(error?error.message:"Cargados "+rows.length);$("#ci").value="";cov()}
function vI(){return`<div class=cd><b>Bienvenido · ${e(RN[rol]||rol)}</b><p class=mu>Tu área ya está activa. Los módulos de tu área se habilitarán pronto.</p></div>`}
async function vH(){const{data,error}=await sb.from("historial").select("*").order("id",{ascending:false}).limit(80);if(error)return`<div class=cd>${e(error.message)}</div>`;return`<div class=cd>${data.map(l=>`<div style="padding:6px 0;border-bottom:1px solid var(--ln)"><small>${new Date(l.cuando).toLocaleString("es-PE")} · ${e(l.por||"sistema")}</small><br>${e(l.tabla)} · ${e(l.accion)}${l.antes&&l.despues&&l.antes.estado!==l.despues.estado?`: ${e(l.antes.estado)} → ${e(l.despues.estado)}`:""}</div>`).join("")||"Aún no hay cambios."}</div>`}
async function vD(){const{data,error}=await sb.from("ventas").select("estado,creada,fecha_inst,asesoras(nombre)").limit(5000);if(error)return`<div class=cd>${e(error.message)}</div>`;const m=T.slice(0,7),mes=data.filter(v=>v.creada.slice(0,7)==m),ins=data.filter(v=>v.estado=="INSTALADA"&&(v.fecha_inst||"").slice(0,7)==m),NC=["CANCELADA","ANULADA","DESAPROBADA","NO PROCEDE","POSIBLE FRAUDE"],nc=mes.filter(v=>NC.includes(v.estado)).length,pr=data.filter(v=>["PROGRAMADA","EN PROGRESO","REPROGRAMADA"].includes(v.estado)).length,ef=ins.length+nc?Math.round(ins.length/(ins.length+nc)*100):0,A={},up=(v,k)=>{const n=v.asesoras?.nombre||"–";(A[n]=A[n]||{v:0,i:0})[k]++};mes.forEach(v=>up(v,"v"));ins.forEach(v=>up(v,"i"));
 return`<div class=kp><div>Ventas del mes<b>${mes.length}</b></div><div>Instaladas del mes<b>${ins.length}</b></div><div>Programadas<b>${pr}</b></div><div>No concretadas<b>${nc}</b></div><div>Efectividad<b>${ef}%</b></div></div><div class=cd><table><tr><th>Asesora</th><th>Ventas</th><th>Instaladas</th></tr>${Object.entries(A).sort((a,b)=>b[1].i-a[1].i).map(([n,x])=>`<tr><td>${e(n)}</td><td>${x.v}</td><td>${x.i}</td></tr>`).join("")||"<tr><td>Sin datos</td></tr>"}</table></div>`}
init();
