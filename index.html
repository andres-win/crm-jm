<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CRM Instaladas JM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#EEF1FA;--c:#fff;--tx:#0E1B3D;--mu:#55618A;--ln:#DCE2F2;--or:#FF7A1A}
@media(prefers-color-scheme:dark){:root{--bg:#0A1230;--c:#16254F;--tx:#F3F5FF;--mu:#B3BEE0;--ln:#2B3D7A}}
body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.w{max-width:1000px;margin:auto;padding:12px}
.hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}
.cd{background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-top:12px;overflow-x:auto}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--c);border:1.5px solid var(--ln);border-radius:10px;padding:9px;min-height:40px}
button{background:var(--or);color:#0E1B3D;font-weight:700;border:0;cursor:pointer}button.g{background:var(--c);color:var(--tx);border:1px solid var(--ln)}
.tb{display:flex;gap:6px;overflow-x:auto;margin-top:12px}.tb button{background:var(--c);color:var(--tx);border:1px solid var(--ln)}.tb .on{background:#0E1B3D;color:#fff}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
table{border-collapse:collapse;width:100%}th{text-align:left;color:var(--mu);font-size:12px}td,th{padding:8px 6px;border-bottom:1px solid var(--ln);vertical-align:top}small,.mu{color:var(--mu)}
.ch{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#ECEEF6;color:#3B4670}.ok{background:#D9F3EC;color:#0B6B57}.n{background:#FFE9D6;color:#9A4300}.x{background:#FDE3E3;color:#A02A2A}
.er{color:#C0392B;font-weight:600}.kp{display:flex;gap:10px;flex-wrap:wrap}.kp div{flex:1;min-width:130px;background:var(--c);border:1px solid var(--ln);border-radius:12px;padding:10px}.kp b{font-size:22px;display:block}
</style></head><body><div class="w"><div class="hd"><h1>CRM Instaladas JM</h1><div id="sl"></div></div><div class="tb" id="nv"></div><div id="m"></div><p id="er" class="er"></p></div>
<script>
const U="https://znrcrkzlysyqeqiyercd.supabase.co",K="sb_publishable_qH2iEk0R59fgmQPqt2gP3A_AxXlomyY",sb=supabase.createClient(U,K);
const $=s=>document.querySelector(s),e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),dim=(y,m)=>new Date(y,m+1,0).getDate(),r2=n=>Math.round(n*100)/100,iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),T=iso(new Date()),money=n=>"S/ "+r2(n).toFixed(2);
const ES=["NUEVA","GRABADO","PROGRAMADA","EN PROGRESO","REPROGRAMADA","INSTALADA","CANCELADA","ANULADA","DESAPROBADA","NO PROCEDE","POSIBLE FRAUDE"];
const PL=[[1,"Plan 500 Mbps",99],[2,"Plan 750 Mbps",109],[3,"Plan 850 Mbps",119],[4,"Plan 1000 Mbps",139],[5,"HB 850 + WTV L1MAX",129.9],[6,"HB 1000 + WTV L1MAX",149.9],[7,"Prov 550 Mbps",89],[8,"Prov 1000 Mbps",129]];
const TABS={admin:["Ventas","Cobranza","Simulador","Cobertura","Historial"],backoffice:["Ventas","Simulador","Cobertura"],cobranza:["Cobranza","Simulador","Cobertura"],rrhh:["Simulador","Cobertura"]};
let rol,tab,planes=[],code=new URLSearchParams(location.search).get("a")||"";
const msg=t=>$("#er").textContent=t||"",ch=a=>`<span class="ch ${a[1]}">${a[0]}</span>`;
function calc(p,fi){if(!p||!fi)return[0,1,2].map(()=>({e:0,v:"",pz:""}));const pr=+p.precio,t=p.dscto_tipo=="pct"?"p":p.dscto_tipo=="soles"?"s":"n",v=+p.dscto_valor,M=+p.dscto_meses,d=new Date(fi+"T12:00"),y=d.getFullYear(),m=d.getMonth(),dia=d.getDate(),dm=t=="p"?pr*v/100:t=="s"?v:0,e2=dia>=23,di=dim(y,m)-dia+1,mo=k=>new Date(y,m+k,1),dly=k=>pr/dim(mo(k).getFullYear(),mo(k).getMonth());let pool=dm>0?M*30:0;
const ds=(n,k)=>{const u=Math.min(n,pool);if(u<=0||dm<=0)return 0;pool-=u;return t=="p"?u*dly(k)*v/100:u*dm/30};
return[0,1,2].map(k=>{let b,s;if(e2){b=k?pr:di*dly(0)+pr;s=k?ds(30,k+1):ds(di+30,1)}else{b=k?pr:di*dly(0);s=k?ds(30,k):ds(di,0)}const o=(e2?1:0)+k;return{e:r2(b-s),v:iso(new Date(y,m+o,28)),pz:iso(new Date(y,m+o+1,0))}})}
/* ---- entrada ---- */
async function init(){if(code){localStorage.crm_a=code;return asesora()}const{data:{session}}=await sb.auth.getSession();if(!session)return login();
 const r=await sb.rpc("crm_rol");rol=r.data;if(!rol){$("#m").innerHTML=`<div class=cd>Tu usuario no tiene un rol asignado. Pide al administrador que lo agregue en crm_staff.</div>`;$("#sl").innerHTML=`<button class=g onclick=out()>Salir</button>`;return}
 const p=await sb.from("planes").select("*").order("id");planes=p.data||[];tab=TABS[rol][0];rd()}
function login(){$("#sl").innerHTML="";$("#nv").innerHTML="";$("#m").innerHTML=`<div class=cd><b>Ingresar</b><div class=fm><input id=lu type=email placeholder="Correo"><input id=lp type=password placeholder="Contraseña"><button onclick=go()>Entrar</button></div><p class=mu>Asesoras: entren con su link personal.</p></div>`}
async function go(){msg();const{error}=await sb.auth.signInWithPassword({email:$("#lu").value.trim(),password:$("#lp").value});if(error)return msg("Correo o contraseña incorrectos");init()}
async function out(){await sb.auth.signOut();location.reload()}
/* ---- asesora ---- */
async function asesora(){$("#sl").innerHTML="";$("#nv").innerHTML="";const{data,error}=await sb.rpc("asesora_ventas",{p_code:code});if(error){$("#m").innerHTML=`<div class=cd class=er>Link no válido. Pide uno nuevo a tu supervisor.</div>`;return}
 $("#m").innerHTML=`<div class=cd><b>Nueva venta</b><div class=fm><input id=fc placeholder="Cliente"><input id=fd placeholder="DNI (8 dígitos)" maxlength=8><input id=ft placeholder="Teléfono (9 dígitos)" maxlength=9><select id=fp>${PL.map(p=>`<option value=${p[0]}>${p[1]} · ${money(p[2])}</option>`).join("")}</select><input id=fi placeholder="Distrito"><button onclick=add()>Registrar</button></div></div>
 <div class=cd><b>Mis ventas</b><table><tr><th>Cliente</th><th>DNI</th><th>Plan</th><th>Distrito</th><th>Estado</th><th>Instalación</th></tr>${data.map(v=>`<tr><td>${e(v.cliente)}</td><td>${e(v.dni)}</td><td>${e(v.plan)}</td><td>${e(v.distrito)}</td><td>${ch([v.estado,v.estado=="INSTALADA"?"ok":"n"])}</td><td>${v.fecha_inst||"–"}</td></tr>`).join("")||"<tr><td>Aún no tienes ventas</td></tr>"}</table></div>`}
async function add(){const c=$("#fc").value.trim(),d=$("#fd").value,t=$("#ft").value;if(!c)return msg("Falta el cliente");if(!/^\d{8}$/.test(d))return msg("El DNI debe tener 8 dígitos");if(!/^\d{9}$/.test(t))return msg("El teléfono debe tener 9 dígitos");
 const{error}=await sb.rpc("asesora_crear",{p_code:code,p_cliente:c,p_dni:d,p_tel:t,p_plan:+$("#fp").value,p_distrito:$("#fi").value});if(error)return msg(error.message);msg();asesora()}
/* ---- personal ---- */
function rd(){$("#sl").innerHTML=`<small>${e(rol)}</small> <button class=g onclick=out()>Salir</button>`;$("#nv").innerHTML=TABS[rol].map(t=>`<button class="${t==tab?"on":""}" onclick="tab='${t}';rd()">${t}</button>`).join("");msg();
 const f={Ventas:vV,Cobranza:vC,Simulador:vS,Cobertura:vO,Historial:vH}[tab];Promise.resolve(f()).then(h=>{if(h!=null)$("#m").innerHTML=h;if(tab=="Simulador")sim();if(tab=="Cobertura")cov()})}
async function vV(){const{data,error}=await sb.from("ventas").select("*,planes(nombre),asesoras(nombre)").order("creada",{ascending:false}).limit(200);if(error)return`<div class=cd>${e(error.message)}</div>`;const ed=rol=="admin"||rol=="backoffice";
 return`<div class=cd><table><tr><th>Cliente</th><th>DNI</th><th>Asesora</th><th>Plan</th><th>Distrito</th><th>Estado</th><th>Instalación</th></tr>${data.map(v=>`<tr><td>${e(v.cliente)}<br><small>${e(v.telefono)}</small></td><td>${e(v.dni)}</td><td>${e(v.asesoras?.nombre)}</td><td>${e(v.planes?.nombre)}</td><td>${e(v.distrito)}</td><td>${ed?`<select onchange="setE('${v.id}',this.value,'${v.fecha_inst||""}')">${ES.map(s=>`<option ${s==v.estado?"selected":""}>${s}</option>`).join("")}</select>`:ch([v.estado,"n"])}</td><td>${ed?`<input type=date value="${v.fecha_inst||""}" onchange="setF('${v.id}',this.value)">`:v.fecha_inst||"–"}</td></tr>`).join("")||"<tr><td>Sin ventas</td></tr>"}</table></div>`}
async function setE(id,es,fi){const u={estado:es};if(es=="INSTALADA"&&!fi)u.fecha_inst=T;const{error}=await sb.from("ventas").update(u).eq("id",id);if(error)msg(error.message);rd()}
async function setF(id,f){const{error}=await sb.from("ventas").update({fecha_inst:f||null}).eq("id",id);if(error)msg(error.message);rd()}
async function vC(){const{data,error}=await sb.from("cobros").select("*,ventas(cliente,fecha_inst,planes(*))").order("vence");if(error)return`<div class=cd>${e(error.message)}</div>`;const g={},pay=rol=="admin"||rol=="cobranza";let pc=0,ve=0;
 data.forEach(c=>{(g[c.venta_id]=g[c.venta_id]||{v:c.ventas,c:[]}).c.push(c)});
 const rows=Object.entries(g).map(([id,x])=>{const cl=calc(x.v.planes,x.v.fecha_inst);return`<tr><td>${e(x.v.cliente)}<br><small>${e(x.v.planes?.nombre)} · inst. ${x.v.fecha_inst}</small></td>${x.c.sort((a,b)=>a.ciclo-b.ciclo).map(c=>{const es=c.esperado??cl[c.ciclo-1].e,s=c.estado=="PAGADO"?["PAGÓ","ok"]:c.estado=="BAJA"?["BAJA",""]:T>c.plazo?["VENCIDO","x"]:["PENDIENTE","n"];if(s[0]=="PENDIENTE")pc+=es;if(s[0]=="VENCIDO"){pc+=es;ve++}
  return`<td>${ch(s)} ${money(es)}<br><small>vence ${c.vence.slice(5)} · plazo ${c.plazo.slice(5)}</small>${c.estado=="PENDIENTE"&&pay?`<br><button onclick="pg('${c.id}',${es})">Pagó</button>`:""}</td>`}).join("")}<td>${pay?`<button class=g onclick="bj('${id}')">Baja</button>`:""}</td></tr>`}).join("");
 return`<div class=kp><div>Por cobrar<b>${money(pc)}</b></div><div>Ciclos vencidos<b>${ve}</b></div><div>En seguimiento<b>${Object.keys(g).length}</b></div></div><div class=cd><table><tr><th>Cliente</th><th>Mes 1</th><th>Mes 2</th><th>Mes 3</th><th></th></tr>${rows||"<tr><td>Aún no hay instaladas. Marca una como INSTALADA en Ventas.</td></tr>"}</table></div>`}
async function pg(id,es){const{error}=await sb.from("cobros").update({estado:"PAGADO",esperado:es,pagado:es,fecha_pago:T}).eq("id",id);if(error)msg(error.message);rd()}
async function bj(id){await sb.from("cobros").update({estado:"BAJA"}).eq("venta_id",id).eq("estado","PENDIENTE");const{error}=await sb.from("eventos").insert({venta_id:id,tipo:"BAJA"});if(error)msg(error.message);rd()}
function vS(){return`<div class=cd><div class=fm><select id=sp onchange=sim()>${planes.map(p=>`<option value=${p.id}>${e(p.nombre)} · ${money(p.precio)}</option>`).join("")}</select><input type=date id=sd value="${T}" onchange=sim()></div><div id=so></div><p class=mu>Prorrateo con días reales del mes. Del día 23 en adelante el mes 1 junta prorrateo + mes siguiente. Vence el 28; plazo hasta fin de mes.</p></div>`}
function sim(){const p=planes.find(x=>x.id==$("#sp").value),f=$("#sd").value;if(!p||!f)return;$("#so").innerHTML=`<table><tr><th>Ciclo</th><th>Monto esperado</th><th>Vence</th><th>Plazo</th></tr>${calc(p,f).map((c,k)=>`<tr><td>Mes ${k+1}</td><td><b>${money(c.e)}</b></td><td>${c.v}</td><td>${c.pz}</td></tr>`).join("")}</table>`}
function vO(){return`<div class=cd><div class=fm><input id=cq placeholder="Buscar predio, distrito o dirección"><input id=cl placeholder="Punto: -12.0797, -77.1087"><button onclick=cov()>Buscar a 300 m</button></div><div id=cr></div>${rol=="admin"?`<details><summary>Cargar predios (nombre;distrito;direccion;torres;hps;lat;lng)</summary><textarea id=ci rows=4 style="width:100%"></textarea><button onclick=imp()>Cargar</button></details>`:""}</div>`}
const hv=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742000*Math.asin(Math.sqrt(x))};
async function cov(){const q=$("#cq").value.toUpperCase().trim(),ll=$("#cl").value.split(",").map(Number),ok=ll.length==2&&!ll.some(isNaN);const{data,error}=await sb.from("predios").select("*").limit(5000);if(error)return $("#cr").textContent=error.message;
 let L=data.filter(p=>!q||((p.nombre||"")+(p.distrito||"")+(p.direccion||"")).toUpperCase().includes(q)).map(p=>({p,d:ok?hv(ll[0],ll[1],p.lat,p.lng):0}));if(ok)L=L.filter(x=>x.d<=300).sort((a,b)=>a.d-b.d);L=L.slice(0,100);
 $("#cr").innerHTML=(ok?`<p class=mu>Radio 300 m · ${L.length} predio(s)</p>`:"")+`<table><tr><th>Predio</th><th>Distrito</th><th>Dirección</th><th>Torres</th><th>HPS</th><th>${ok?"Distancia":""}</th></tr>${L.map(x=>`<tr><td>${e(x.p.nombre)}</td><td>${e(x.p.distrito)}</td><td>${e(x.p.direccion)}</td><td>${e(x.p.torres)}</td><td>${x.p.hps??""}</td><td>${ok?Math.round(x.d)+" m":""}</td></tr>`).join("")||"<tr><td>Sin resultados. Carga predios primero.</td></tr>"}</table>`}
async function imp(){const rows=$("#ci").value.split("\n").map(l=>l.split(";")).filter(a=>a.length>=7&&!isNaN(+a[5])).map(a=>({nombre:a[0].toUpperCase(),distrito:a[1].toUpperCase(),direccion:a[2],torres:a[3],hps:+a[4]||null,lat:+a[5],lng:+a[6]}));if(!rows.length)return msg("No encontré filas válidas");const{error}=await sb.from("predios").insert(rows);msg(error?error.message:"Cargados "+rows.length);$("#ci").value="";cov()}
async function vH(){const{data,error}=await sb.from("historial").select("*").order("id",{ascending:false}).limit(80);if(error)return`<div class=cd>${e(error.message)}</div>`;return`<div class=cd>${data.map(l=>`<div style="padding:6px 0;border-bottom:1px solid var(--ln)"><small>${new Date(l.cuando).toLocaleString("es-PE")} · ${e(l.por||"sistema")}</small><br>${e(l.tabla)} · ${e(l.accion)}${l.antes&&l.despues&&l.antes.estado!==l.despues.estado?`: ${e(l.antes.estado)} → ${e(l.despues.estado)}`:""}</div>`).join("")||"Aún no hay cambios."}</div>`}
init();
</script></body></html>
