 <div><small>PROYECCIÓN</small><b>${proy}</b><small>${fin>=T?"al cierre del periodo":"periodo cerrado"}</small></div><div><small>DÍAS HÁBILES</small><b>${remH}</b><small>quedan</small></div></div></div>
 <div class=dg>
 <div class=kc style="background:var(--k1)"><h4 style="color:var(--k1t)">Ingresadas</h4><div class=bg style="color:var(--k1t)">${P.length}</div><small>Ventas registradas en el periodo</small></div>
 <div class=kc style="background:var(--k2)"><h4 style="color:var(--k2t)">En camino</h4><div class=bg style="color:var(--k2t)">${pg2.length}</div><small>Programadas, en proceso o reprogramadas</small></div>
 <div class=kc style="background:var(--k3)"><h4 style="color:var(--k3t)">Altas</h4><div class=bg style="color:var(--k3t)">${al.length}</div><small>No concretadas: <b>${cn.length}</b></small></div></div>
 <div class=fn><div class=kc style="background:var(--k1);text-align:center"><h4 style="color:var(--k1t)">Pre-venta → venta (neta)</h4><div class=bg style="color:var(--k1t)">${pct(apr,P.length)}</div><small>${apr} aprobadas de ${P.length} ingresadas</small></div>
 <div class=kc style="background:var(--k2);text-align:center"><h4 style="color:var(--k2t)">Venta → alta</h4><div class=bg style="color:var(--k2t)">${pct(al.length,apr)}</div><small>${al.length} instaladas de ${apr} aprobadas</small></div>
 <div class=kc style="background:var(--k3);text-align:center"><h4 style="color:var(--k3t)">Concreción total</h4><div class=bg style="color:var(--k3t)">${pct(al.length,P.length)}</div><small>${al.length} instaladas de ${P.length} ingresadas</small></div></div>
 <div class=cd><b>Cumplimiento del periodo</b>${ndH>93||(fin<ini)?`<p class=mu>El gráfico se muestra para periodos de hasta 93 días.</p>`:(()=>{const c=chartD(ini,fin,P,tiers);return c||`<p class=mu>El gráfico se muestra para periodos de hasta 93 días.</p>`})()}</div>
 <div class=cd><b>Por asesora</b><table><tr><th>Asesora</th><th>Ingresadas</th><th>Instaladas</th><th>En camino</th><th>Canceladas</th><th>Concreción</th></tr>${Object.entries(A).sort((a,b)=>b[1].z-a[1].z).map(([id,x])=>`<tr><td>${e(nm[id]||"—")}</td><td>${x.i}</td><td><b>${x.z}</b></td><td>${x.p}</td><td>${x.c}</td><td>${x.z+x.c?Math.round(x.z/(x.z+x.c)*100)+"%":"—"}</td></tr>`).join("")||"<tr><td>Sin datos en este periodo</td></tr>"}</table><small class=mu>Concreción = instaladas ÷ (instaladas + canceladas).</small></div>
 <div class=dg><div class=cd style="margin:0"><b>Planes más vendidos</b>${bars(cnt("plan"),"#5B8DEF")}</div><div class=cd style="margin:0"><b>Distritos con más instaladas</b>${bars(cnt("distrito"),"#1FB59A")}</div></div>
 <div class=cd><b>Ventas instaladas con detalle</b><div class=ps><div><b>${D.length}</b><small>instaladas</small></div><div><b style="font-size:20px">${mon(suma)}</b><small>suma de precios</small></div><div><b style="font-size:20px">${D.length?mon(suma/D.length):"—"}</b><small>precio promedio</small></div></div><small class=mu>Detalle del mes de la hoja INSTALADAS (plan, distrito y precio).</small></div>
 <div style="margin-top:8px">${foot}</div>`}
init();
</script></body></html>
